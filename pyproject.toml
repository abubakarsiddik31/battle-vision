[project]
name = "kiit-mita-classification"
version = "0.1.0"
description = "KIIT-MiTA Multi-Label Image Classification with PyTorch"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "Pillow>=9.0.0",
    "numpy>=1.21.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "trackio>=0.1.0",
    "pyyaml>=6.0",
]

[tool.uv]
dev-dependencies = [
    "trackio>=0.1.0",
    "pyyaml>=6.0",
]
